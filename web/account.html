<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FresherPilot · Settings</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/account.css" />
  </head>
  <body>
    <main class="setup">
      <header class="brand"><span class="logo" aria-hidden="true">JF</span>
        <div><h1>Settings</h1><p class="tagline" id="who"></p></div>
        <div class="row" style="margin-left:auto"><a class="btn" href="/">← Back to jobs</a><button class="btn" id="logout">Log out</button></div></header>

      <section class="panel">
        <h2>API keys</h2>
        <p class="muted small">Stored encrypted with your password; only usable while you're logged in.</p>
        <label class="field">Groq API key<input id="GROQ_API_KEY" type="password" autocomplete="off" /></label>
        <label class="field">Apify API token<input id="APIFY_API_KEY" type="password" autocomplete="off" /></label>
        <label class="field">Gmail address<input id="GMAIL_ADDRESS" autocomplete="off" /></label>
        <label class="field">Gmail app password<input id="GMAIL_APP_PASSWORD" type="password" autocomplete="off" /></label>
        <div class="row"><button class="btn primary" id="saveKeys">Save keys</button><span class="small" id="keysMsg"></span></div>
      </section>

      <section class="panel">
        <h2>Job search</h2>
        <label class="field">Summary (the AI matches jobs against this)<textarea id="summary" rows="2"></textarea></label>
        <label class="field">Jobs that fit you<input id="target_area" /></label>
        <label class="field">Who you are (used in messages)<input id="headline" /></label>
        <div class="grid2">
          <label class="field">Years of full-time experience<input id="experience_years" type="number" min="0" step="0.5" /></label>
          <label class="field">Hide jobs asking for this many years or more<input id="reject_from_years" type="number" min="1" step="1" /></label>
        </div>
        <label class="field">Job titles to search<textarea id="roles" rows="2"></textarea></label>
        <label class="field">LinkedIn searches (up to 6)<input id="linkedin_titles" /></label>
        <label class="field">Cities (e.g. Pune, Bangalore, Remote; empty = all India; fewer cities = less Apify credit, but each extra city adds LinkedIn searches)<input id="locations" /></label>
        <label class="field">Technologies you don't work with<textarea id="off_stack" rows="2"></textarea></label>
        <label class="field">Skills (empty = read from your resume)<textarea id="skills" rows="3"></textarea></label>
        <div class="row"><button class="btn primary" id="savePrefs">Save search settings</button>
          <a class="link-btn" href="/onboarding">Upload a new resume…</a><span class="small" id="prefsMsg"></span></div>
      </section>

      <section class="panel">
        <h2>Password</h2>
        <div class="grid2">
          <label class="field">Current password<input id="oldPw" type="password" autocomplete="current-password" /></label>
          <label class="field">New password (8+ characters)<input id="newPw" type="password" autocomplete="new-password" /></label>
        </div>
        <div class="row"><button class="btn" id="savePw">Change password</button><span class="small" id="pwMsg"></span></div>
      </section>
    </main>
    <script src="/static/account.js"></script>
    <script>
      const LISTS = ["skills", "roles", "linkedin_titles", "off_stack", "locations"];
      loadKeys().then((me) => {
        if (!me) return;
        $("who").textContent = `Signed in as ${me.user.username}${me.user.owner ? " (owner)" : ""}`;
        const s = me.prefs;
        for (const k of ["headline", "summary", "target_area", "experience_years", "reject_from_years"]) $(k).value = s[k] ?? "";
        for (const k of LISTS) $(k).value = (s[k] || []).map((x) => x.trim()).join(", ");
      });
      $("savePrefs").onclick = async () => {
        const prefs = {};
        for (const k of ["headline", "summary", "target_area"]) prefs[k] = $(k).value.trim();
        prefs.experience_years = Number($("experience_years").value || 0);
        prefs.reject_from_years = Math.max(1, Number($("reject_from_years").value || 1));
        for (const k of LISTS) prefs[k] = $(k).value.split(",").map((x) => x.trim()).filter(Boolean);
        prefs.linkedin_titles = prefs.linkedin_titles.slice(0, 6);
        prefs.off_stack = prefs.off_stack.map((w) => (/^[a-z]+$/i.test(w) ? w.toLowerCase() + " " : w.toLowerCase()));
        const res = await fetch("/api/account/prefs", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(prefs) });
        msg("prefsMsg", res.ok ? "Saved ✓ (used from the next fetch)" : "Couldn't save", !res.ok);
      };
      $("savePw").onclick = async () => {
        const res = await fetch("/api/account/password", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ old: $("oldPw").value, new: $("newPw").value }) });
        const d = await res.json().catch(() => ({}));
        msg("pwMsg", res.ok ? "Password changed ✓" : d.detail || "Couldn't change it", !res.ok);
      };
      $("logout").onclick = async () => {
        await fetch("/api/auth/logout", { method: "POST" });
        location.href = "/login";
      };
    </script>
  </body>
</html>
