<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FresherPilot · Sign in</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <style>
      .auth { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
      .auth-card { width: min(400px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 18px;
        padding: 28px; box-shadow: var(--shadow-lg); display: grid; gap: 16px; }
      .auth-card h1 { margin: 0; font-size: 1.3rem; }
      .auth-card label { display: grid; gap: 5px; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
      .auth-card input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line-strong);
        background: var(--sunken); color: var(--text); }
      .auth-card .btn { justify-content: center; }
      .auth-msg { margin: 0; color: var(--bad); font-size: 0.88rem; min-height: 1.2em; }
      .switch { text-align: center; font-size: 0.88rem; color: var(--muted); }
    </style>
  </head>
  <body>
    <main class="auth">
      <form class="auth-card" id="form">
        <div class="brand"><span class="logo" aria-hidden="true">JF</span>
          <div><h1 id="heading">Sign in</h1><p class="tagline" id="sub">Your jobs, matched to your resume</p></div></div>
        <label>Username<input id="username" autocomplete="username" required minlength="3" /></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required minlength="8" /></label>
        <p class="auth-msg" id="msg" role="alert"></p>
        <button class="btn primary" type="submit" id="submit">Sign in</button>
        <p class="switch"><span id="switchText">New here?</span> <button type="button" class="link-btn" id="switchBtn">Create an account</button></p>
        <p class="muted small" id="note" hidden>The first account on this computer becomes the owner and keeps the existing jobs, profile and keys.</p>
      </form>
    </main>
    <script>
      const $ = (id) => document.getElementById(id);
      let mode = "login";
      function setMode(m) {
        mode = m;
        const reg = m === "register";
        $("heading").textContent = reg ? "Create your account" : "Sign in";
        $("submit").textContent = reg ? "Create account" : "Sign in";
        $("switchText").textContent = reg ? "Already have an account?" : "New here?";
        $("switchBtn").textContent = reg ? "Sign in" : "Create an account";
        $("password").autocomplete = reg ? "new-password" : "current-password";
        $("msg").textContent = "";
      }
      fetch("/api/auth/state").then((r) => r.json()).then((s) => {
        if (!s.has_accounts) { setMode("register"); $("note").hidden = false; }
      });
      $("switchBtn").onclick = () => setMode(mode === "login" ? "register" : "login");
      $("form").onsubmit = async (e) => {
        e.preventDefault();
        $("submit").disabled = true;
        $("msg").textContent = "";
        try {
          const res = await fetch(`/api/auth/${mode}`, { method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username: $("username").value, password: $("password").value }) });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Something went wrong");
          location.href = data.next || "/";
        } catch (err) {
          $("msg").textContent = err.message;
        } finally {
          $("submit").disabled = false;
        }
      };
    </script>
  </body>
</html>
